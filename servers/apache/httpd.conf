# Apache HTTP Server 2.4 (imagen oficial httpd:2.4) — laboratorio.
# Publica la aplicación de prueba mediante proxy inverso. Equivalente funcional a servers/nginx/nginx.conf.

ServerRoot "/usr/local/apache2"
Listen 80
ServerName apache.lab.local

LoadModule mpm_event_module  modules/mod_mpm_event.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule unixd_module      modules/mod_unixd.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule headers_module    modules/mod_headers.so
LoadModule proxy_module      modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so

User daemon
Group daemon
PidFile logs/httpd.pid

ServerTokens Prod
ServerSignature Off
TraceEnable Off

# --- Registros (formato 'combined', el mismo que usa NGINX en esta práctica) ---
ErrorLog "logs/error.log"
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
CustomLog "logs/access.log" combined

# --- Proxy inverso hacia la aplicación de prueba ---
ProxyRequests Off
ProxyPreserveHost On
ProxyPass        "/" "http://app-apache:8000/"
ProxyPassReverse "/" "http://app-apache:8000/"
# mod_proxy_http añade X-Forwarded-For con la IP del cliente que ve Apache (último valor).

<Location "/">
    Require all granted
</Location>

# La app responde "Server: gunicorn"; se oculta para no revelar la tecnología interna.
Header always set Server "Apache"
