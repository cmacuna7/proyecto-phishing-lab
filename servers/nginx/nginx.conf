# NGINX (imagen oficial nginx:alpine) — laboratorio.
# Publica la aplicación de prueba mediante proxy inverso. Equivalente funcional a servers/apache/httpd.conf.

worker_processes 1;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    # Mismo formato 'combined' que Apache, para poder analizar ambos con el mismo script.
    log_format combined_lab '$remote_addr - $remote_user [$time_local] "$request" '
                            '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log combined_lab;
    error_log  /var/log/nginx/error.log warn;

    server {
        listen 80;
        server_name nginx.lab.local;

        # DNS interno de Docker; con variable, NGINX arranca aunque la app aún no esté lista.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend "app-nginx:8000";

        location / {
            proxy_pass http://$backend;
            proxy_set_header Host              $host;
            # Se SOBREESCRIBE (no se concatena) para que un cliente no pueda falsear su IP.
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_hide_header Server;   # no revelar "gunicorn"; NGINX añade su propio encabezado
            add_header X-Content-Type-Options nosniff always;
        }
    }
}
